# Bird per month. Fill each slot; empty slots are allowed (warnings only).
# photo.file is the photo's filename inside paths.photos_dir (see photos.lock, stage 3).
year: 2027
birds:
  - month: 1
    common_name: Rainbow Lorikeet
    scientific_name: Yeetus Lorikeetus
    description: >
      The Rainbow Lorikeet is consistently listed as one of the most common
      birds in Australia. This bird thrives in urban environments, and is
      pictured here snacking on the nectar from a Grevillea flower.
    location: Jolon's old house, Mulgrave
    date_taken: null
    photo_credit: null
    photo: { file: IMG_1856-Enhanced-NR.jpg }
  - month: 2
    common_name: Australian Gannet
    scientific_name: Gannetus Planetus
    description: >
      Gannet partners show affection by looking at the sky and gently touching
      bills. Often, the male Gannet will drape seaweed over his partner, as a
      gift of course.
    location: Gannet colony, Point Danger
    date_taken: null
    photo_credit: null
    photo: { file: IMG_9801.jpg }
  - month: 3
    common_name: Striated Grasswren
    scientific_name: Mister Grassus Wreni
    description: >
      Striated Grasswrens are small, shy birds of arid mallee country. We
      tracked this one at Hattah by its quiet, high-pitched call. You really
      have to work for your passerines.
    location: Hattah-Kulkyne National Park
    date_taken: null
    photo_credit: null
    photo: { file: _DSC6819.jpg }
  - month: 4
    common_name: Freckled Duck
    scientific_name: Duckus Duckus Goosus
    description: >
      Freckled Ducks typically inhabit ephemeral lakes in the vast Australian
      outback. This makes finding one in the wild a truly daunting task. Luckily
      this Freckled Duck landed near Melbourne. We have no idea why, but we were
      happy to see it.
    location: Braeside Park
    date_taken: null
    photo_credit: null
    photo: { file: IMG_2216.jpg }
  - month: 5
    common_name: Silvereye
    scientific_name: Ag Oculus
    description: >
      Silvereyes are found across the Pacific islands from Australia to Fiji.
      They are a tiny and erratic bird, making photography difficult.
      Fortunately this one was slowed down by the (relatively) enormous berry it
      was trying to eat.
    location: Howqua near Fry's Flat
    date_taken: null
    photo_credit: null
    photo: { file: IMG_8848-Enhanced-NR.jpg }
  - month: 6
    common_name: Crested Pigeon
    scientific_name: Pigeoerectus
    description: >
      A photo of a bird in front of a rainbow takes very careful planning, local
      meteorological knowledge, and most of all - patience. We have none of
      those things and this was blind luck.
    location: Just out of Echuca
    date_taken: null
    photo_credit: null
    photo: { file: 1P2A6049.jpg }
  - month: 7
    common_name: Red-capped Robin (female)
    scientific_name: Rossa Robina
    description: >
      The female Red-capped Robin is grey-brown, with only a faint hint of red
      on the head. Here she is posed in front of ash from the Longwood fires in
      early 2026.
    location: Euroa
    date_taken: null
    photo_credit: null
    photo: { file: IMG_1542.jpg }
  - month: 8
    common_name: Brolga
    scientific_name: Nota Flamingus
    description: >
      It is estimated that there are fewer than 700 Brolgas remaining in the
      south of Australia. Though, Jolon has seen them bonking on two separate
      occasions, so hopefully numbers are on the up.
    location: Western Treatment Plant (the poo farm), Werribee
    date_taken: null
    photo_credit: null
    photo: { file: IMG_2058.jpg }
  - month: 9
    common_name: Swift Parrot
    scientific_name: Lathamus discolor
    description: >
      Swift Parrots migrate to Tasmania each year to breed, and only about 500
      remain. They are critically endangered, mostly due to their breeding
      grounds having been logged.
    location: Plenty Gorge Park
    date_taken: null
    photo_credit: null
    photo: { file: IMG_4385.jpg }
  - month: 10
    common_name: Grey Teal
    scientific_name: We think
    description: |
      Thick mist permeates
      The swamp whispers in your ear
      Come my friend, come in
    location: Gemmills Swamp, Mooroopna
    date_taken: null
    photo_credit: null
    photo: { file: _DSC5792.jpg }
  - month: 11
    common_name: Eastern Spinebill
    scientific_name: Lumbar williami
    description: >
      This was taken by our friend, Emily Frye, who stole Jolon's camera on a
      Grampians camping trip and then took a photo better than he could.
    location: Grampians National Park
    date_taken: null
    photo_credit: null
    photo: { file: IMG_1096.jpg }
  - month: 12
    common_name: Pink Robin
    scientific_name: Pinky Dinky
    description: >
      Pink Robins are small birds of wet forest in south-eastern Australia, and
      the males have a striking pink breast. This one braved a snowy November
      morning.
    location: Mt Donna Buang
    date_taken: null
    photo_credit: null
    photo: { file: IMG_8320.jpg }
