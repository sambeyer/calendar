# Text on the back of the calendar (the last sheet's back). Fill in both photographers.
# Until the names and bios are set, the proof shows "to come" placeholders and print is refused.
year: 2027
photographers:
  - name: Jolon D'Amore
    bio: >
      Jolon D'Amore was born in Mooroopna but was forced to move to
      Melbourne when poilce requested to question him about a
      stoken KFC bucket. Now he takes photos of birds.
  - name: Sam Beyer
    bio: >
      Sam Beyer was born in the Netherlands but was forced
      to move to Australia when competitive seal clubbing was
      outlawed. Now he takes photos of birds.
# Donation encouragement, shown under the photographers.
appeal: >
  If you feel the desire to pay us for this calendar, please
  donate the $15 to Bird Life Australia instead.
